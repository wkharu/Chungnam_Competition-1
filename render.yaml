services:
  - type: web
    name: tteonago
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TOUR_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: AIR_KOREA_API_KEY
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: PYTHON
        value: python3
